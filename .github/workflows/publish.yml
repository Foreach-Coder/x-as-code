name: publish

# push master：把 git 分支与 tag 镜像到 GitCode。
# push v* tag（或在 Actions 页面手动填 tag 运行）：跑测试、打包发行包、发 GitHub release、镜像 git、同步 GitCode release 与 tar.gz。
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布到 GitCode 的 tag，例如 v0.1.1'
        required: true

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  GITCODE_HOST: gitcode.com
  GITCODE_OWNER: foreach1991
  GITCODE_REPO: x-as-code
  PROJECT_DIR: java-systemd-service-as-code

jobs:
  mirror:
    name: mirror git refs to GitCode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
      - name: push branches and tags
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_FOREACH1991 }}
        run: |
          set -euo pipefail
          if [ -z "${GITCODE_TOKEN:-}" ]; then
            echo "GITCODE_FOREACH1991 secret is not configured" >&2
            exit 1
          fi
          git fetch --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          remote="https://${GITCODE_OWNER}:${GITCODE_TOKEN}@${GITCODE_HOST}/${GITCODE_OWNER}/${GITCODE_REPO}.git"
          git push --prune "$remote" \
            '+refs/remotes/origin/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

  release:
    name: publish release
    needs: mirror
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # 被测源码取 tag，CI 脚本取默认分支（tag 里可能还没有这些文件）。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-systemd-service-as-code/pom.xml

      - name: test
        run: mvn -B -f "$PROJECT_DIR/pom.xml" test

      - name: package
        run: mvn -B -f "$PROJECT_DIR/pom.xml" -DskipTests package

      - name: resolve tag
        id: meta
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$tag" ]; then
            echo "cannot resolve tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: verify distribution package
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          tarball=$(ls "$PROJECT_DIR"/target/java-systemd-service-cli-*.tar.gz | head -n 1)
          echo "tarball: $tarball"
          tar -tzvf "$tarball"
          workdir=$(mktemp -d)
          tar -xzf "$tarball" -C "$workdir"
          root=$(ls -d "$workdir"/java-systemd-service-cli-*)
          test -x "$root/bin/java-systemd-service-cli"
          version=$("$root/bin/java-systemd-service-cli" --version)
          echo "wrapper reports version: $version"
          test "$version" = "${TAG#v}"

          # init: template generation must work from the packaged jar (resource inside)
          initdir=$(mktemp -d)
          printf '\n\n\n' | "$root/bin/java-systemd-service-cli" init "$initdir"
          test -f "$initdir/demo/xac.yaml"
          grep -qx 'name: demo' "$initdir/demo/xac.yaml"

          # launcher help lists the shell-side commands too
          "$root/bin/java-systemd-service-cli" --help | grep -q 'install'
          "$root/bin/java-systemd-service-cli" --help | grep -q 'uninstall'

          # install/uninstall: link into PATH, verify through PATH, then remove it
          "$root/bin/java-systemd-service-cli" install --dry-run | grep -q 'would link'
          sudo "$root/bin/java-systemd-service-cli" install
          test -L /usr/local/bin/java-systemd-service-cli
          java-systemd-service-cli --version | grep -qx "${TAG#v}"
          sudo "$root/bin/java-systemd-service-cli" uninstall
          test ! -e /usr/local/bin/java-systemd-service-cli

      - name: create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          asset=$(ls "$PROJECT_DIR"/target/java-systemd-service-cli-*.tar.gz | head -n 1)
          name=$(basename "$asset")
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$asset" --title "xac $TAG" --generate-notes
            exit 0
          fi
          echo "GitHub release $TAG already exists"
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$name"; then
            echo "asset $name is already attached"
          else
            echo "attaching $name"
            gh release upload "$TAG" "$asset"
          fi

      - name: download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --pattern '*.tar.gz' --dir dist
          ls -l dist

      - name: export GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > release-notes.md
          wc -c release-notes.md

      - name: sync GitCode release and asset
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_FOREACH1991 }}
        run: |
          set -euo pipefail
          asset=$(ls dist/*.tar.gz | head -n 1)
          pwsh -NoProfile -File ci/.github/scripts/sync-gitcode-release.ps1 \
            -Owner "$GITCODE_OWNER" \
            -Repo "$GITCODE_REPO" \
            -Tag "${{ steps.meta.outputs.tag }}" \
            -Asset "$asset" \
            -NotesFile release-notes.md
